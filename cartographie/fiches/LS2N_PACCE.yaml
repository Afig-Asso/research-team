synthese: 'Perception, action et cognition en réalité virtuelle et augmentée : incarnation d''avatars, perception et interaction
  en réalité augmentée optique, haptique passive, analytique immersive et agents virtuels pour la formation.'
pour_etudiants: On y étudie comment on perçoit son corps, les distances et les objets en réalité virtuelle et augmentée, et
  comment des avatars ou des personnages virtuels changent notre comportement.
pour_entreprises: Conception et évaluation d'applications de réalité virtuelle et augmentée (perception, incarnation, accessoires
  physiques), visualisation immersive de données et simulateurs de formation aux compétences sociales.
