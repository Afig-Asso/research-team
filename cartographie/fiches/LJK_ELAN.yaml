synthese: Simulation physique d'objets minces et déformables (tiges, coques, tissus, cheveux), contact et frottement, estimation
  de paramètres physiques par vision.
pour_etudiants: On y simule des objets fins et souples (cheveux, tissus, rubans, plumes) avec une physique précise, et on
  retrouve leur forme à partir d'observations.
pour_entreprises: Simulation prédictive de fibres, tissus et coques avec frottement, mesure de frottement par vidéo, et matériaux
  granulaires.
