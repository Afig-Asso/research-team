synthese: Retour haptique (ultrasons, vibrations, stimulation thermique), interaction physique en réalité virtuelle et augmentée,
  simulation pour l'assistance au handicap.
pour_etudiants: On y fait sentir les objets virtuels au bout des doigts, avec des ultrasons, des vibrations ou de la chaleur,
  et on conçoit des simulateurs de fauteuil roulant en réalité virtuelle.
pour_entreprises: Dispositifs haptiques portables pour la RV/RA et la téléopération de robots, simulateurs et aide à la navigation
  (fauteuil, déambulateur) et simulation d'objets déformables.
