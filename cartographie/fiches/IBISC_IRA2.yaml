themes:
- id: formation_rv
  phrase: Simulateurs immersifs d'apprentissage de gestes techniques (microchirurgie, anesthésie échoguidée, maintien de l'ordre),
    guidage par un mentor et débriefing immersif.
  preuves:
  - p4705ce73ec
  - pfd2d7b71df
  - p147be61662
- id: haptique
  phrase: Rôle du retour haptique dans l'acquisition et le transfert de compétences en RV, rendu haptique de profils d'effort
    mesurés et calibration de dispositifs à câbles.
  preuves:
  - p0507a741d3
  - pdca47bb64b
  - p1d17964faf
- id: interaction_3d
  phrase: Techniques de sélection et de manipulation 3D d'objets distants ou occultés, sur tablette ou en RV, et saisie de
