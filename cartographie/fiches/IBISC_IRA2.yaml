synthese: Simulateurs immersifs de formation aux gestes techniques, retour haptique et multimodal, techniques d'interaction
  3D, réalité augmentée pour la rééducation et l'industrie, environnements virtuels collaboratifs.
pour_etudiants: On y conçoit des simulateurs en réalité virtuelle pour apprendre des gestes techniques, par exemple en chirurgie,
  en ressentant le toucher grâce à des dispositifs haptiques.
pour_entreprises: Conception et évaluation de simulateurs de formation immersifs à retour haptique, d'outils auteur de scénarios
  et d'assistance en réalité augmentée pour l'industrie et la santé.
