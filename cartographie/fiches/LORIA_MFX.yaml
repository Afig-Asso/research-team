synthese: 'Algorithmes pour la fabrication additive : préparation à l''impression 3D, microstructures et métamatériaux, conception
  inverse.'
pour_etudiants: On écrit les algorithmes qui transforment un modèle 3D en objet imprimé, avec des matériaux et des formes
  qu'on ne pourrait pas fabriquer autrement.
pour_entreprises: Optimisation de l'impression 3D (trajectoires, supports, multi-axes), conception de pièces à propriétés
  mécaniques sur mesure, capteurs imprimés.
