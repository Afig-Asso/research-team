synthese: 'Perception et qualité d''expérience des contenus 3D et immersifs : qualité des maillages, nuages de points et vidéos
  volumétriques, compression de géométrie, géovisualisation et analytique immersives.'
pour_etudiants: On y mesure comment les gens perçoivent la qualité des objets 3D, des nuages de points et des vidéos en réalité
  virtuelle, pour mieux les compresser et les afficher.
pour_entreprises: Bases de données et métriques de qualité pour maillages, nuages de points et vidéos volumétriques, protocoles
  de tests utilisateurs en XR, visualisation immersive de données urbaines.
