themes:
- id: perception
  phrase: Évaluation subjective et objective de la qualité visuelle des maillages texturés et contenus 3D, en particulier
    en réalité virtuelle, et métriques apprises de qualité.
  preuves:
  - pc19cbde7b9
  - p2e928ffbf5
  - pe5ea9a107e
- id: nuages_points
  phrase: Qualité perçue des nuages de points statiques et dynamiques en contexte de compression, d'éclairage et de rendu
    ombré, y compris pour les humains numériques en réalité étendue.
  preuves:
  - pe18913fe55
  - p60da107745
  - p13ae3b3f00
- id: compression_geometrie
  phrase: Compression de la géométrie et des normales de nuages de points par quantification vectorielle sur réseaux de points
    arborescents.
  preuves:
  - ped1c3d6b96
  - p36f0b44541
  - p28a74a309d
- id: visu_immersive
  phrase: Géovisualisation immersive de données urbaines multicouches, analytique immersive en casque et restitution d'ambiances
    lumineuses et climatiques urbaines en réalité virtuelle.
  preuves:
  - p642e1dd750
  - pae86214da1
  - p7bac7f741d
- id: capture_4d
  phrase: Évaluation de la qualité des vidéos volumétriques en réalité étendue et effet du sous-échantillonnage temporel sur
    les métriques.
  preuves:
  - p4432690c5b
  - p04c6df9d8b
  - p0b968d205f
