synthese: Rendu neuronal et à base d'images (Gaussian splatting), modélisation par esquisse, simulation de terrains et acquisition
  de l'apparence.
pour_etudiants: On transforme des photos en scènes 3D qu'on peut parcourir en temps réel, on crée des modèles à partir de
  croquis et on simule la formation des paysages.
pour_entreprises: Numérisation photoréaliste de lieux par Gaussian splatting, CAO par esquisse, génération de terrains, conception
  par réemploi de matériaux.
