synthese: 'Modélisation géométrique : courbes et surfaces lisses ou rugueuses, algèbre géométrique et fractales, analyse de
  formes pour le réassemblage d''objets fragmentés.'
pour_etudiants: On y invente des façons mathématiques de dessiner des courbes, des surfaces lisses ou rugueuses, et de recoller
  des objets anciens brisés.
pour_entreprises: Conception de formes complexes ou rugueuses pour la CAO et les matériaux, et outils 3D pour l'indexation
  et le réassemblage d'objets patrimoniaux.
