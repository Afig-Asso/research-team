synthese: Photogrammétrie et lidar pour la reconstruction de modèles 3D de villes, de paysages et de monuments.
pour_etudiants: On y transforme des photos et des relevés laser en modèles 3D de villes, de paysages et de monuments.
pour_entreprises: Photogrammétrie et lidar à grande échelle, reconstruction 3D de bâtiments et de surfaces, mise à jour de
  maquettes urbaines et relevés patrimoniaux.
