themes:
- id: photogrammetrie_lidar
  phrase: Chaînes de photogrammétrie ouvertes (images aériennes, satellitaires, de drone et historiques) et traitement de
    lidar aérien et mobile pour la cartographie 3D à grande échelle.
  preuves:
  - p0e6d3e611c
  - p633218277a
  - p1ceabdc9f1
- id: reconstruction_surfaces
  phrase: Reconstruction de surfaces étanches à partir de nuages de points massifs, distribuée ou par réseaux de neurones
    sur graphes de Delaunay, et évaluation sur données réelles.
  preuves:
  - pfae476a030
  - p7715883016
  - pcda80afc09
- id: modeles_urbains
  phrase: Reconstruction de bâtiments en LoD2 à partir de lidar aérien et d'emprises, mise à jour des maquettes urbaines par
    détection de changements.
  preuves:
  - pba7899516a
  - p9daafc7bdf
  - pc8fa56e5c1
- id: rendu_neuronal
  phrase: Champs de radiance neuronaux pour images satellitaires (réflectance BRDF, vues éparses) et apprentissage efficace
    de nombreuses scènes en espace latent.
  preuves:
  - p5da079cefe
  - pef866bbe37
  - p5b35e9437d
- id: nuages_points
  phrase: Recherche et reconnaissance de lieux dans de grands nuages de points et régularisation de leur étiquetage sémantique.
  preuves:
  - p2a307f537e
  - p43855393e0
  - p30c98fae5b
- id: maillages
  phrase: Simplification de maillages préservant la sémantique, édition robuste de polyèdres et triangulations de Delaunay
    distribuées.
  preuves:
  - p1e2970d807
  - pb41d563806
  - peefbfd050b
