synthese: Perception et interaction en réalité augmentée et virtuelle, haptique, collaboration en réalité mixte hétérogène,
  incarnation, analytique immersive et environnements de formation.
pour_etudiants: On y étudie comment voir, toucher et manipuler des objets virtuels en réalité virtuelle ou augmentée, seul
  ou à plusieurs, et on crée des environnements pour apprendre ou analyser des données.
pour_entreprises: Conception et évaluation d'applications XR pour l'industrie (jumeaux numériques, conception collaborative,
  formation), retours haptiques, visualisation immersive de données et valorisation du patrimoine.
