synthese: Modélisation et synthèse de contenus naturels (textures, terrains, océans, végétation), traitement de nuages de
  points et étude de l'incarnation en réalité virtuelle.
pour_etudiants: On y fabrique automatiquement des textures, des océans et des terrains, on mesure des arbres en 3D et on étudie
  les avatars en réalité virtuelle.
pour_entreprises: Génération procédurale de textures et d'environnements pour le jeu et l'animation, mesure 3D de végétation
  et applications de RV (thérapie, collaboration).
