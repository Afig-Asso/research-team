synthese: 'Géométrie discrète : estimation de courbure et calcul différentiel sur surfaces digitales, convexité digitale ;
  algèbre géométrique conforme et projective pour la modélisation de quadriques et de courbes.'
pour_etudiants: On y étudie les formes faites de pixels et de voxels, comment mesurer leur courbure ou leur convexité, et
  on utilise une algèbre spéciale pour manipuler simplement cercles, sphères et quadriques.
pour_entreprises: Algorithmes exacts et robustes d'analyse de formes voxelisées ou numérisées (normales, courbures, décomposition
  convexe) et bibliothèques d'algèbre géométrique pour la géométrie computationnelle.
