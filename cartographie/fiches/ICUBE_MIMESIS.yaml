synthese: Simulation physique temps réel de tissus déformables (éléments finis, découpe, insertion d'aiguilles), réalité augmentée
  chirurgicale par recalage biomécanique, simulateurs de formation haptiques et jumeaux numériques d'organes.
pour_etudiants: On y simule en temps réel le comportement des organes du corps humain pour entraîner les chirurgiens en réalité
  virtuelle et les guider pendant l'opération en réalité augmentée.
pour_entreprises: Simulateurs chirurgicaux temps réel, guidage peropératoire par réalité augmentée, commande de robots d'insertion
  d'aiguilles et modèles de substitution rapides pour les jumeaux numériques médicaux.
