synthese: 'Conception assistée d''objets fabricables : conception inverse, métamatériaux, structures souples (gonflables,
  textiles) et modélisation par esquisse.'
pour_etudiants: On y invente des méthodes pour concevoir sur ordinateur des objets réellement fabricables (structures gonflables,
  tissus, pièces imprimées) et pour modeler en 3D par le dessin.
