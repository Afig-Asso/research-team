synthese: Génération de maillages hexaédriques et paramétrisation pour la simulation, déformation et mise en correspondance
  de formes.
pour_etudiants: On découpe des formes 3D en petits blocs bien réguliers pour que les ordinateurs puissent les simuler, et
  on apprend à mettre deux formes en correspondance.
