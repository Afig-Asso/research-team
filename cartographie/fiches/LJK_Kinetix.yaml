synthese: Capture 4D multi-vues et reconstruction de la forme et du mouvement humains (corps, vêtements), modèles génératifs
  de mouvement.
pour_etudiants: On y filme des personnes avec de nombreuses caméras pour reconstruire en 3D leur corps, leurs vêtements et
  leurs mouvements.
pour_entreprises: Numérisation 3D et 4D précise de personnes, mesures corporelles et composition corporelle à partir de scans,
  estimation du squelette depuis la surface du corps, animation et déformation de vêtements virtuels.
