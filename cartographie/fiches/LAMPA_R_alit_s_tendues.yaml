synthese: 'Expérience utilisateur en réalité virtuelle et étendue : incarnation et présence, avatars expressifs, esquisse
  3D immersive pour la conception de produits, apprentissage et interaction 3D.'
pour_etudiants: On y étudie ce que l'on ressent quand on habite un avatar en réalité virtuelle, et on y utilise la réalité
  virtuelle pour dessiner des objets en 3D ou apprendre un métier.
pour_entreprises: Conception et évaluation d'expériences immersives (présence, incarnation, charge mentale), outils de conception
  de produits et de formation en réalité virtuelle.
