synthese: Reconstruction 3D à partir de photographies et de relevés laser, génération de mouvement humain, géométrie discrète
  et outils algébriques pour les formes.
pour_etudiants: On y reconstruit des objets, des bâtiments et des forêts en 3D à partir de photos et de scans laser, on génère
  des mouvements humains à partir de texte et on invente des outils mathématiques pour manipuler formes et courbes.
pour_entreprises: Numérisation 3D et segmentation de nuages de points lidar (chantiers, forêts, villes), reconstruction de
  maillages par Gaussian splatting, génération de mouvements 3D et calcul géométrique robuste sur courbes et quadriques.
