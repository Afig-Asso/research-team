themes:
- id: reconstruction_surfaces
  phrase: Reconstruction de surfaces à partir de nuages de points, d'images multi-vues ou de segments 3D, avec réseaux de
    neurones sur graphes de Delaunay, surfaces implicites neuronales et banc d'essai comparatif des méthodes.
  preuves:
  - pfae476a030
  - p7715883016
  - p676b52b609
- id: nuages_points
  phrase: Segmentation sémantique rapide par superpoints, analyse d'arbres individuels et complétion de scènes lidar à partir
    de grands nuages de points aériens et terrestres.
  preuves:
  - p687af80846
  - pc25455914b
  - p93936c0612
- id: rendu_neuronal
  phrase: Gaussian splatting aligné sur les surfaces pour extraire des maillages éditables, et décomposition de scènes en
    primitives par rendu différentiable.
  preuves:
  - pc39c161f5e
  - p6a864478e5
  - pf66d20b9c1
- id: modeles_generatifs
  phrase: Génération de mouvements humains 3D à partir de descriptions textuelles, composition temporelle et spatiale d'actions
    et recherche texte-mouvement.
  preuves:
  - p8b85f8a5c9
  - p45de398cd6
  - p9e8eef696b
- id: algebre_geometrique
  phrase: Algèbres géométriques conformes et projectives pour représenter et intersecter coniques, quadriques et courbes de
    Bézier, jusqu'aux diagrammes de Voronoï et de puissance.
  preuves:
  - p45ec3296fd
  - p00d6413cca
  - ped958b6627
- id: geometrie_discrete
  phrase: 'Rotations et mouvements rigides discrétisés sur grilles carrées, cubiques et hexagonales : bijectivité, topologie
    et arrangements de quadriques dans l''espace des paramètres.'
  preuves:
  - p3f9023e42d
  - p880636d398
  - p92d8f06040
