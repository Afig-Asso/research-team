synthese: Analyse topologique et géométrique des formes (squelettes, homologie persistante), reconstruction de terrains et
  de végétation à partir de nuages de points.
pour_etudiants: On y analyse des formes 3D (trous, squelettes, courbure) et on reconstruit des terrains ou des arbres à partir
  de scans laser.
pour_entreprises: Analyse de maillages et de nuages de points (forêts, terrains, cratères), maillage pour la simulation et
  jumeaux numériques industriels.
