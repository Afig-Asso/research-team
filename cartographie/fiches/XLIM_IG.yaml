synthese: Modélisation géométrique et topologique (cartes combinatoires, géométrie discrète, courbes et surfaces), modèles
  de réflectance et visualisation scientifique.
pour_etudiants: On décrit mathématiquement les formes, y compris sur des grilles de pixels et de voxels, et la manière dont
  la lumière se reflète sur les matériaux, et on visualise des données médicales ou moléculaires.
pour_entreprises: Modèles d'apparence de matériaux (routes, surfaces mouillées, revêtements), modeleurs géométriques fiables,
  géométrie discrète pour l'imagerie et les données voxeliques, visualisation de données médicales 3D.
