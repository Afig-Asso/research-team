themes:
- id: reconstruction_surfaces
  phrase: Reconstruction 3D fine par stéréophotométrie, intégration de normales et stéréo multi-vues, y compris en milieu
    réfractant ou sous éclairage proche.
  preuves:
  - pdea0fbd791
  - p99292bca58
  - p2eef3b6cea
- id: photogrammetrie_lidar
