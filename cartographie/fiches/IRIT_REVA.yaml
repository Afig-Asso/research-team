synthese: Reconstruction 3D photométrique et multi-vues, numérisation du patrimoine, rendu neuronal et vidéo volumétrique,
  environnements immersifs de formation.
pour_etudiants: On y reconstruit des objets et des sites en 3D à partir de photos (grottes ornées, statues, surface de la
  Lune) et on crée des simulateurs de formation en réalité virtuelle.
pour_entreprises: Numérisation 3D fine et logiciel libre de photogrammétrie, reconstruction et rendu d'objets d'intérêt, simulateurs
  immersifs de formation (gestion de crise, ingénierie).
