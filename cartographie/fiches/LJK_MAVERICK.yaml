synthese: Transport de lumière et illumination globale, matériaux et milieux participants, rendu GPU, rendu expressif et cartographie
  panoramique.
pour_etudiants: On y calcule des images où la lumière, les matériaux brillants, la fumée ou les nuages se comportent comme
  dans la réalité, et aussi des rendus stylisés et des cartes panoramiques.
pour_entreprises: Rendu réaliste et rapide de matériaux complexes, de caustiques et de très grandes scènes, ainsi que génération
  de cartes panoramiques de montagne.
