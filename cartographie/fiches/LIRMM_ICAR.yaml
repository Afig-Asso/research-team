synthese: Synthèse de textures et rendu stylisé, simplification de modèles 3D, visualisation immersive de données biologiques
  et médicales.
pour_etudiants: On y crée des textures et des images stylisées, on simplifie de gros modèles 3D, on explore des données biologiques
  en réalité virtuelle et on aide les médecins à manipuler des images 3D du corps.
pour_entreprises: Génération de textures à la volée, affichage multirésolution de très grands maillages, rétro-conception
  de pièces numérisées, outils 3D interactifs et immersifs pour la chirurgie, l'anatomie et la biologie.
