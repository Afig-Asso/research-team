synthese: Analyse, modélisation et simulation du mouvement humain ; boucle perception-action en réalité virtuelle, appliquée
  notamment à l'entraînement sportif.
pour_etudiants: On y mesure et on simule le mouvement humain, et on entraîne des sportifs de haut niveau en réalité virtuelle.
pour_entreprises: Analyse posturale et ergonomique sur site, avatars 3D personnalisés et simulateurs sportifs en RV pour évaluer
  et entraîner la prise de décision des athlètes.
