synthese: Modélisation par esquisse, simulation de matériaux déformables, synthèse de textures et traitement d'images et de
  vidéos.
pour_etudiants: On invente des outils pour dessiner des objets 3D à main levée, on simule des matières qui se déforment de
  façon réaliste et on génère des textures et des effets visuels pour les images et les vidéos.
pour_entreprises: Prototypage rapide de formes 3D par croquis ou en RV, simulation temps réel d'objets déformables, outils
  de colorisation pour l'animation 2D, synthèse de textures et effacement d'objets dans les vidéos pour la post-production.
