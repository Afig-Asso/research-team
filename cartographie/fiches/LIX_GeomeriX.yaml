synthese: Analyse et correspondance de formes 3D, déformation et reconstruction, apprentissage géométrique et simulation de
  fluides.
pour_etudiants: On y invente des outils mathématiques pour comparer, reconstruire et déformer des formes 3D, et pour simuler
  fumée, eau et tornades.
pour_entreprises: Mise en correspondance et reconstruction de formes 3D, simulation rapide de fluides turbulents et multiphasiques,
  apprentissage sur données 3D (protéines, cerveau).
