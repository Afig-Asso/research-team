synthese: Modélisation de terrains et de phénomènes naturels, représentations géométriques (surfaces implicites, géométrie
  discrète), échantillonnage pour le rendu, maquettes urbaines 4D et réalité virtuelle multisensorielle.
pour_etudiants: On y crée des paysages virtuels, on invente des outils mathématiques pour représenter et analyser des formes
  3D, on améliore le calcul des images, on enrichit la réalité virtuelle avec chaleur et odeurs, et on construit des maquettes
  3D de villes qui évoluent dans le temps.
pour_entreprises: Génération de terrains et d'environnements naturels, géométrie robuste sur maillages et nuages de points,
  échantillonnage pour le rendu, réalité virtuelle multisensorielle, simulateurs médicaux et maquettes numériques 3D de villes
  et de territoires.
