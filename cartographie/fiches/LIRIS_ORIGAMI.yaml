themes:
- id: terrains_nature
  phrase: Synthèse et édition de terrains par érosion multi-échelle, isocontours, modèles vectoriels ou de diffusion, ainsi
    que rivières, glaciers, karsts et écosystèmes.
  preuves:
  - p96b0661b13
  - p4eb50fd9c8
  - p5494c6c727
- id: surfaces_implicites
  phrase: Accélération, bornes et flots explicites pour les surfaces implicites et champs de distance signée, y compris probabilistes.
  preuves:
  - p7cd0c1645c
  - p627539e432
  - p92aa14767d
- id: echantillonnage
  phrase: Séquences à faible discrépance (Sobol', brouillage d'Owen différentiable), bruit bleu et transport optimal rapide
    pour l'intégration Monte-Carlo en rendu.
  preuves:
  - p23ec467877
  - p849f91c022
  - pac95b69b08
- id: geometrie_discrete
  phrase: Calcul différentiel sur surfaces digitales et nuages de points (Laplace-Beltrami corrigé, courbures), algorithmes
    de sondage de plans et décomposition convexe/concave de formes digitalisées.
  preuves:
  - pf5e25d4f68
  - pa0acd88a9d
  - p7c7e7d293b
- id: modeles_urbains
  phrase: Maquettes urbaines 3D sémantiques et versionnées (CityGML, ontologies), diffusion web de villes évolutives et jumeau
