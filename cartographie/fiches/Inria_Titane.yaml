synthese: Reconstruction de modèles 3D compacts (bâtiments, villes, objets) à partir de mesures laser et photographiques ;
  génération et simplification de maillages.
pour_etudiants: On transforme des mesures du monde réel (scans laser, photos aériennes) en modèles 3D propres et légers de
  bâtiments, de villes et d'objets.
pour_entreprises: Reconstruction 3D de villes et de bâtiments à partir de lidar ou d'images, réparation et simplification
  de maillages, compression de données 3D.
