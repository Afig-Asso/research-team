synthese: Visualisation d'information et analytique visuelle, sur écrans, dispositifs mobiles et en réalité augmentée ; évaluation
  perceptive des représentations.
pour_etudiants: On invente de nouvelles façons de représenter des données en images, sur écran, sur montre ou en réalité augmentée,
