synthese: 'Interaction gestuelle et haptique : instruments numériques, dispositifs de réalité mixte pour la performance artistique
  et retour tactile sur surfaces.'
pour_etudiants: On y invente des instruments de musique et des spectacles en réalité virtuelle ou augmentée, et des écrans
  tactiles qui font sentir des textures sous le doigt.
