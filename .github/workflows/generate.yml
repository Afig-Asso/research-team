name: Generate README and JSON

on:
  push:
    paths:
      - 'data.yaml'
  workflow_dispatch:

# un seul job à la fois : deux modifications rapprochées de data.yaml ne se marchent pas dessus
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml tqdm

      - name: Generate files
        run: python scripts/generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md json/data.json
          git diff --staged --quiet || git commit -m "Auto-generate README.md and data.json from data.yaml"
          # main a pu avancer pendant le job : on se remet à jour avant de pousser (3 essais)
          for i in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}"; then git push && exit 0; else git rebase --abort || true; fi
            sleep 5
          done
          exit 1
